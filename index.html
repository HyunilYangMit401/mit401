<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 모음</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9; /* 차분한 실버 톤 바탕 */
            color: #0f172a;
            overflow-x: hidden;
            position: relative;
            padding: 40px 24px;
        }

        /* 은은한 실버 블루 Glow */
        .glow-bg {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(186, 230, 253, 0.45) 0%, rgba(203, 213, 225, 0.4) 45%, rgba(241, 245, 249, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
            z-index: 0;
        }

        /* 실버 메탈릭 글래스 패널 */
        .main-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: center;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 56px 48px;
            box-shadow: 
                0 20px 40px -15px rgba(148, 163, 184, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        }

        /* 좌측 헤더 */
        .header {
            text-align: left;
        }

        .subtitle {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #0284c7;
            background: rgba(224, 242, 254, 0.8);
            border: 1px solid rgba(186, 230, 253, 0.8);
            padding: 5px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -1px;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .desc {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 실버 블루 인덱스 리스트 */
        .link-list {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #cbd5e1;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8px;
            border-bottom: 1px solid #cbd5e1;
            color: #334155;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .index {
            font-size: 0.8rem;
            font-weight: 700;
            color: #0284c7;
            font-mono: monospace;
        }

        .name {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            transition: color 0.25s ease;
        }

        .arrow {
            font-size: 0.95rem;
            color: #94a3b8;
            transition: all 0.25s ease;
            transform: translateX(-4px);
        }

        /* 호버 스타일 */
        .link-card:hover {
            padding-left: 16px;
            padding-right: 8px;
            background: rgba(255, 255, 255, 0.65);
            border-bottom-color: #0284c7;
        }

        .link-card:hover .name {
            color: #0284c7;
        }

        .link-card:hover .arrow {
            color: #0284c7;
            transform: translateX(0);
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .main-frame {
                grid-template-columns: 1fr;
                gap: 36px;
                padding: 36px 24px;
            }

            .header {
                text-align: left;
            }

            h2 {
                font-size: 2.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg" id="glow"></div>

    <div class="main-frame">
        <div class="header">
            <span class="subtitle">Spring Collection</span>
            <h2>작품 모음</h2>
            <p class="desc">참여 작가들의 아카이브 페이지입니다.</p>
        </div>

        <div class="link-list">
            <a href="minkyu.html" class="link-card">
                <div class="item-info">
                    <span class="index">01</span>
                    <span class="name">김민규</span>
                </div>
                <span class="arrow">➔</span>
            </a>
            <a href="csj.html" class="link-card">
                <div class="item-info">
                    <span class="index">02</span>
                    <span class="name">채서진</span>
                </div>
                <span class="arrow">➔</span>
            </a>
            <a href="choikiha.html" class="link-card">
                <div class="item-info">
                    <span class="index">03</span>
                    <span class="name">최기하</span>
                </div>
                <span class="arrow">➔</span>
            </a>
            <a href="chung.html" class="link-card">
                <div class="item-info">
                    <span class="index">04</span>
                    <span class="name">이충길</span>
                </div>
                <span class="arrow">➔</span>
            </a>
            <a href="CSY.html" class="link-card">
                <div class="item-info">
                    <span class="index">05</span>
                    <span class="name">최서연</span>
                </div>
                <span class="arrow">➔</span>
            </a>
        </div>
    </div>

    <script>
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });
    </script>
</body>
</html>
